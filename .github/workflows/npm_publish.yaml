name: npm_publish

# Dispatched by tests.yaml on the npm-v<version> tag it created for the version
# commit. Re-run a failed publish by dispatching this workflow on the same tag.
on:
    workflow_dispatch:

concurrency:
    group: npm-publish
    cancel-in-progress: false

jobs:
    publish:
        if: startsWith(github.ref, 'refs/tags/npm-v')
        runs-on: ubuntu-latest
        environment:
            name: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: npm ci
            - run: npm publish
